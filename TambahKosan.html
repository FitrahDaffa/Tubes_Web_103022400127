<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Data Kosan</title>
    <link rel="stylesheet" href="style/TambahKosan.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="KosanHubLogo.png" alt="KosanHub">
            <h1>Kosan Hub</h1>
        </div>

        <nav>
            <ul>
                <li><a href="main.html">Home</a></li>
                <li><a href="DetailKosan.html">Detail Kosan</a></li>
                <li><a href="TambahKosan.html">Tambah Data Kosan</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="formTambahKosan">
            <h2>Tambah Data Kosan</h2>

            <form>
                <div class="form-group">
                    <label for="nama">Nama:</label>
                    <input type="text" id="nama" name="nama" required>
                </div>

                <div class="form-group">
                    <label for="tipe_kamar">Tipe Kamar:</label>
                    <select id="tipe_kamar" name="tipe_kamar" required>
                        <option value="">Pilih Tipe Kamar</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tanggal_masuk">Tanggal Masuk:</label>
                    <input type="date" id="tanggal_masuk" name="tanggal_masuk" required>
                </div>

                <div class="form-group">
                    <label for="no_token_listrik">No Token Listrik:</label>
                    <input type="text" id="no_token_listrik" name="no_token_listrik" required>
                </div>

                <div class="form-group">
                    <label for="banyak_penghuni">Banyak Penghuni:</label>
                    <input type="number" id="banyak_penghuni" name="banyak_penghuni" min="1" required>
                </div>

                <div class="form-group">
                    <label for="status">Status:</label>
                    <select id="status" name="status" required>
                        <option value="">Pilih Status</option>
                        <option value="Terisi">Terisi</option>
                        <option value="Kosong">Kosong</option>
                        <option value="Perbaikan">Perbaikan</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="harga_sewa">Harga Sewa:</label>
                    <input type="number" id="harga_sewa" name="harga_sewa" min="0" required>
                </div>

                <div class="form-group">
                    <label for="tanggal_tempo">Tanggal Tempo:</label>
                    <input type="date" id="tanggal_tempo" name="tanggal_tempo">
                </div>

                <div class="form-button">
                    <input type="submit" value="Tambah Data">
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>Web_103022400127</p>
    </footer>
</body>
</html>
